<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Aspivra</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0a">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=Geist:wght@400;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --ink: #0b0b0a; --bone: #f2f0ea; --bone-2: rgba(242, 240, 234, 0.64); --volt: #d9ff3d; --gutter: clamp(16px, 4vw, 56px); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; grid-template-rows: auto 1fr; background: var(--ink); color: var(--bone); font: 380 17px/1.6 "Geist", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--volt); outline-offset: 3px; border-radius: 4px; }
    header { padding: 18px var(--gutter); }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 800 16px/1 "Archivo", Arial, sans-serif; font-stretch: 125%; letter-spacing: 0.02em; text-transform: uppercase; }
    .brand svg { width: 26px; height: 26px; }
    main { align-self: center; padding: 48px var(--gutter) 96px; }
    .kicker { font: 500 12px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bone-2); margin: 0 0 24px; }
    h1 { margin: 0 0 28px; font: 800 clamp(40px, 10vw, 140px)/0.86 "Archivo", Arial, sans-serif; font-stretch: 125%; letter-spacing: -0.045em; text-transform: uppercase; }
    h1 span { display: block; }
    h1 .o { color: transparent; -webkit-text-stroke: 1.5px var(--bone); }
    p { margin: 0 0 32px; color: var(--bone-2); max-width: 44ch; }
    .ctas { display: flex; flex-wrap: wrap; align-items: center; gap: 28px; }
    .btn { display: inline-flex; padding: 18px 26px; border-radius: 999px; background: var(--bone); color: var(--ink); font: 600 15px/1 "Geist", Arial, sans-serif; text-decoration: none; transition: background-color 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
    .btn:hover { background: var(--volt); }
    .link { text-decoration: none; background: linear-gradient(currentColor, currentColor) 0 100% / 100% 1px no-repeat; padding-bottom: 2px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 4 20 20h-3.7L12 11.2 7.7 20H4z"/><path fill="currentColor" d="M10 17h4l1.2 2.3H8.8z"/></svg>Aspivra</a>
  </header>
  <main>
    <p class="kicker">404 · Page not found</p>
    <h1><span>Wrong</span><span class="o">trail.</span></h1>
    <p>That page isn't here. The part is still on the home page, standing still while the world moves.</p>
    <div class="ctas">
      <a class="btn" href="/">Back to Aspivra</a>
      <a class="link" href="/#apply">Apply for early access</a>
    </div>
  </main>
</body>
</html>
